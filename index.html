<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>오늘의 포춘쿠키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  /* 출근길 아침, 버터색 벽 앞에서 돌아가는 토마토색 행운 룰렛 */
  --wall: #fbe7b4;
  --cabinet: #e2513b;
  --cabinet-dark: #b63a28;
  --ink: #2b1d16;
  --paper: #fffdf6;
  --gold: #f2c230;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --slip: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--wall);
  background-image: radial-gradient(rgba(226,81,59,.13) 1.5px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--body);
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
  padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
}
button { font-family: var(--display); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.top { width: min(360px, 100%); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.date { font-family: var(--display); font-size: 22px; letter-spacing: -0.5px; }
.greet { font-size: 14px; color: #7a5a3a; text-align: right; }
h1 { font-family: var(--display); font-weight: 400; color: var(--cabinet); font-size: 34px; margin: 10px 0 2px; letter-spacing: -0.5px; text-align: center; }
.sub { margin: 0 0 12px; font-size: 14px; color: #7a5a3a; text-align: center; }

/* ---------- 룰렛 ---------- */
.wheelbox { position: relative; width: min(330px, 92vw); aspect-ratio: 1; }
.wheelbox > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pointer { transform-origin: 160px 6px; }
.bulb { fill: #ffe08a; }
@media (prefers-reduced-motion: no-preference) {
  .bulb { animation: blink 1.4s infinite; }
  .bulb.odd { animation-delay: .7s; }
  @keyframes blink { 50% { fill: #b9442f; } }
  .spinning .bulb { animation-duration: .25s; }
}
.hub {
  position: absolute; left: 50%; top: 50%; width: 27%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%; border: 0; background: #ffd04d; color: var(--ink); font-size: 19px; line-height: 1.1;
  box-shadow: 0 5px 0 #c9951c, 0 0 0 6px var(--cabinet);
}
.hub:active:not(:disabled) { transform: translate(-50%, calc(-50% + 3px)); box-shadow: 0 2px 0 #c9951c, 0 0 0 6px var(--cabinet); }
.hub:disabled { cursor: default; }
.hub.done { background: #fff7e3; box-shadow: 0 5px 0 #d8c7a3, 0 0 0 6px var(--cabinet); font-size: 15px; }
.hint { width: min(360px, 100%); text-align: center; font-size: 14px; color: #7a5a3a; margin: 14px 0 0; min-height: 20px; }

/* ---------- 출석 도장 ---------- */
.week { width: min(360px, 100%); margin-top: 14px; background: var(--paper); border-radius: 16px; padding: 14px 14px 12px; box-shadow: 0 3px 0 rgba(122,90,58,.15); }
.week-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.week-head b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.streak { font-size: 13px; color: #a0522d; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; color: #8a6d4f; }
.day { display: grid; gap: 4px; justify-items: center; }
.slot { width: 36px; height: 36px; border-radius: 50%; border: 2px dashed #e3d5b8; display: grid; place-items: center; }
.slot.today { border-color: var(--cabinet); border-style: solid; }
.slot.stamped { border: 0; background: #fdf0d2; }
.slot svg { width: 30px; height: 22px; }
.rowbtns { display: flex; gap: 8px; margin-top: 10px; }
.rowbtns button { flex: 1; border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 12px; padding: 10px; font-size: 15px; }

/* ---------- 모달 ---------- */
.reveal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(43,29,22,.62); overflow: hidden; }
.reveal[hidden] { display: none; }
.stage { display: grid; justify-items: center; gap: 14px; }
.stage[hidden] { display: none; }
.tierbanner { font-family: var(--display); font-size: 22px; color: #fff7e3; padding: 6px 18px; border-radius: 999px; }
.bigcookie { position: relative; width: 240px; height: 173px; border: 0; background: none; padding: 0; }
.bigcookie .half { position: absolute; inset: 0; transition: transform .7s cubic-bezier(.2,.9,.3,1.2), opacity .7s; }
.bigcookie .half svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 12px rgba(0,0,0,.3)); overflow: visible; }
.bigcookie .l { clip-path: inset(0 50% 0 0); }
.bigcookie .r { clip-path: inset(0 0 0 50%); }
.bigcookie.open .l { transform: translate(-80px, 30px) rotate(-30deg); opacity: 0; }
.bigcookie.open .r { transform: translate(80px, 30px) rotate(30deg); opacity: 0; }
.bigcookie.glow .half svg { filter: drop-shadow(0 0 26px rgba(255,220,110,.95)); }
.cookiename { font-family: var(--display); color: #fff7e3; font-size: 22px; text-align: center; }
.tapme { color: #fff7e3; font-size: 15px; opacity: .85; }
@media (prefers-reduced-motion: no-preference) {
  .bigcookie:not(.open) { animation: wiggle 1.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) scale(1.03) } }
}
.confetti { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.card {
  width: min(380px, 100%); max-height: calc(100% - 16px); overflow-y: auto;
  background: var(--paper); border-radius: 4px; padding: 22px 22px 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,.35); font-family: var(--slip);
  background-image: repeating-linear-gradient(transparent 0 31px, rgba(226,81,59,.08) 31px 32px);
}
.card[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: unroll .6s cubic-bezier(.2,.9,.3,1) both; transform-origin: center top; }
  @keyframes unroll { from { transform: scaleY(.05); opacity: 0; } }
}
.card .when { font-family: var(--body); font-size: 13px; color: #a0522d; letter-spacing: 1px; text-align: center; }
.ckhead { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; margin: 12px 0 4px; padding: 10px; background: #fbf4e4; border-radius: 12px; font-family: var(--body); }
.ckhead svg { width: 64px; height: 46px; overflow: visible; }
.ckhead b { font-family: var(--display); font-weight: 400; font-size: 18px; display: block; }
.ckhead small { font-size: 12.5px; color: #8a6d4f; }
.tier { display: inline-block; font-family: var(--display); font-size: 12px; color: #fff; padding: 1px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; }
.card .main { font-size: 22px; font-weight: 700; line-height: 1.55; text-align: center; margin: 14px 0 14px; text-wrap: balance; word-break: keep-all; }
.sec { border-top: 1.5px dashed #e3d5b8; padding: 12px 0; display: grid; gap: 6px; }
.sec h3 { margin: 0; font-family: var(--body); font-weight: 400; font-size: 12px; letter-spacing: 1.5px; color: #a0522d; }
.sec p { margin: 0; font-size: 16px; line-height: 1.6; word-break: keep-all; }
.sec .aside { font-family: var(--body); font-size: 12px; color: #a08a70; }
.bonus { background: #fff3c4; margin: 0 -10px; padding: 12px 10px; border-radius: 8px; border-top: 0; }
.meter { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-family: var(--body); }
.meter .name { font-size: 14px; }
.meter .pct { font-family: var(--display); font-size: 16px; color: var(--cabinet); font-variant-numeric: tabular-nums; }
.meter .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: #efe4cc; overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffb35c, var(--cabinet)); }
.meter .note { grid-column: 1 / -1; font-size: 12.5px; color: #8a6d4f; }
.wx { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; font-family: var(--body); padding: 4px 0; }
.wx svg { width: 40px; height: 40px; }
.wx div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.wx .slotname { font-size: 13px; color: #8a6d4f; min-width: 52px; }
.wx b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.wx .leave { font-family: var(--display); font-size: 13px; color: #fff; background: var(--cabinet); padding: 1px 8px; border-radius: 999px; }
.wx small { flex-basis: 100%; font-size: 13.5px; color: #5c4632; }
.quote cite { font-style: normal; font-family: var(--body); font-size: 13px; color: #8a6d4f; }
.cardbtns { display: flex; gap: 10px; margin-top: 12px; }
.cardbtns button { flex: 1; font-size: 17px; border-radius: 12px; padding: 12px; border: 2px solid var(--ink); }
.cardbtns .ghostb { background: transparent; color: var(--ink); }
.cardbtns .solid { background: var(--ink); color: #fff7e3; }
.copied { font-family: var(--body); font-size: 13px; color: #2f6a28; text-align: center; min-height: 18px; margin-top: 8px; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 26px; text-align: center; margin: 0 0 4px; }
.panel .lead { text-align: center; font-family: var(--body); font-size: 13px; color: #8a6d4f; margin: 0 0 12px; }
.odds { width: 100%; border-collapse: collapse; font-family: var(--body); font-size: 14px; margin-bottom: 10px; }
.odds td { padding: 7px 4px; border-bottom: 1px dashed #e3d5b8; }
.odds td:last-child { text-align: right; font-family: var(--display); font-variant-numeric: tabular-nums; }
.odds td:nth-child(2) { color: #8a6d4f; font-size: 12.5px; }
.dexgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; font-family: var(--body); }
.dexcell { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; background: #fbf4e4; text-align: center; }
.dexcell svg { width: 48px; height: 35px; overflow: visible; }
.dexcell.locked svg { filter: grayscale(1) brightness(.35) opacity(.35); }
.dexcell small { font-size: 10px; line-height: 1.2; color: #6a5440; word-break: keep-all; min-height: 24px; }
.dexsec { font-family: var(--display); font-size: 15px; margin: 14px 0 6px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="top">
  <div class="date" id="date">오늘</div>
  <div class="greet" id="greet">오늘도 화이팅!</div>
</div>
<h1>오늘의 포춘쿠키</h1>
<p class="sub">룰렛을 돌려 오늘의 쿠키를 받아 가세요</p>

<div class="wheelbox" id="wheelbox">
  <svg viewBox="-4 -4 328 328" aria-hidden="true">
    <circle cx="160" cy="160" r="160" fill="#e2513b"/>
    <circle cx="160" cy="160" r="160" fill="none" stroke="#b63a28" stroke-width="6"/>
    <g id="bulbs"></g>
    <g id="wheel"></g>
    <g class="pointer" id="pointer">
      <path d="M160 34 L146 6 Q160 -2 174 6 Z" fill="#ffd04d" stroke="#2b1d16" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </svg>
  <button class="hub" id="spin">룰렛<br>돌리기</button>
</div>
<p class="hint" id="hint">하루에 한 번, 가운데 버튼을 눌러 보세요</p>

<section class="week" aria-label="이번 주 출석">
  <div class="week-head"><b>이번 주 출석 도장</b><span class="streak" id="streak"></span></div>
  <div class="days" id="days"></div>
  <div class="rowbtns"><button id="dexBtn">쿠키 도감</button><button id="oddsBtn">확률 보기</button></div>
</section>

<div class="reveal" id="reveal" hidden>
  <div class="stage" id="stage">
    <div class="tierbanner" id="tierbanner"></div>
    <button class="bigcookie" id="bigcookie" aria-label="포춘쿠키 깨기">
      <div class="half l"><svg viewBox="0 0 100 72"><use id="bigL" href=""/></svg></div>
      <div class="half r"><svg viewBox="0 0 100 72"><use id="bigR" href=""/></svg></div>
    </button>
    <div class="cookiename" id="cookiename"></div>
    <div class="tapme">쿠키를 톡 눌러 깨 보세요</div>
  </div>
  <article class="card" id="card" hidden aria-live="polite"></article>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<script>
/* ============ 포춘쿠키 속 문장들 ============ */
const MESSAGES = [
"오늘은 생각보다 일이 술술 풀리는 날이에요.","작은 친절 하나가 오후를 바꿔 놓을 거예요.","미뤄 둔 일 하나를 끝내면 마음이 확 가벼워져요.","오늘 만나는 사람 중 한 명이 좋은 소식을 가져와요.","완벽하지 않아도 괜찮아요. 시작한 것만으로 충분해요.","오늘은 질문을 많이 할수록 운이 따라요.","잠깐 창밖을 보는 5분이 아이디어를 데려다줘요.","어제의 고민이 오늘은 생각보다 작아 보일 거예요.","누군가 당신 덕분에 웃게 되는 날이에요.","천천히 가도 방향만 맞으면 돼요.",
"오늘 하는 말에는 힘이 실려요. 좋은 말을 골라 써 보세요.","기다리던 답장이 올지도 몰라요.","정리 정돈을 하면 행운이 자리를 잡아요.","오늘은 '고마워요'를 세 번 말해 보세요. 돌아오는 게 있어요.","계획대로 안 돼도 더 나은 길이 열리는 날이에요.","당신이 생각하는 것보다 당신은 잘하고 있어요.","점심 이후로 운이 점점 좋아져요.","오전에 집중하면 오후가 여유로워져요.","오래 연락 못 한 사람에게 안부를 전하기 좋은 날이에요.","오늘 떠오른 엉뚱한 생각을 메모해 두세요. 나중에 쓸모가 있어요.",
"작은 실수는 웃어넘기면 금방 잊혀요.","오늘은 잘 들어 주는 사람이 이기는 날이에요.","새로 배우는 것 하나가 큰 자산이 될 거예요.","퇴근길에 기분 좋은 우연이 기다리고 있어요.","오늘의 당신은 평소보다 설득력이 있어요.","조용히 해낸 일이 누군가의 눈에 띄어요.","마음에 걸리던 일이 자연스럽게 풀려요.","오늘은 '아니요'라고 말해도 괜찮은 날이에요.","동료와 나눈 짧은 수다가 큰 힘이 돼요.","따뜻한 음료 한 잔이 행운을 불러요.",
"오늘은 하나만 잘해도 충분히 잘한 하루예요.","생각지 못한 칭찬을 듣게 될지도 몰라요.","숫자와 서류 운이 좋은 날이에요. 꼼꼼함이 빛나요.","오늘 하는 선택은 대체로 옳아요. 자신을 믿어 보세요.","한 템포 쉬어 가면 더 멀리 가요.","오랫동안 준비한 일이 결실을 향해 가고 있어요.","오늘은 웃는 얼굴이 최고의 무기예요.","도움을 청하면 기꺼이 손 내밀어 줄 사람이 있어요.","바쁜 와중에도 나를 위한 10분을 챙겨 보세요.","오늘은 새로운 길로 걸어 보면 좋은 일이 생겨요.",
"마음먹은 일을 시작하기에 딱 좋은 날이에요.","오늘은 시간이 기대보다 넉넉하게 느껴질 거예요.","당신의 아이디어가 회의에서 빛을 봐요.","작은 목표를 이루는 기쁨을 맛보는 하루예요.","오늘은 남과 비교하지 말고 어제의 나만 보세요.","꼬였던 일정이 한 번에 정리돼요.","예상 못 한 간식이 생길 수 있어요.","오늘은 당신의 성실함이 행운을 끌어당겨요.","걱정했던 일은 대부분 일어나지 않아요.","지금 하고 있는 일은 생각보다 의미가 커요.",
"마음이 통하는 사람을 만나는 날이에요.","서두르지 않아도 제때 도착해요.","오늘 받은 피드백 속에 좋은 힌트가 숨어 있어요.","가볍게 던진 농담이 분위기를 살려요.","미소를 잃지 않으면 하루가 부드럽게 흘러가요.","한 가지에 집중하면 놀라운 결과가 나와요.","어려운 대화도 오늘은 부드럽게 풀려요.","오늘은 정리하는 손길마다 운이 붙어요.","지친 마음에 작은 선물을 주세요. 그럴 자격이 충분해요.","평범한 하루 속에서 반짝이는 순간을 발견할 거예요.",

function weatherIcon(id) {
  const sun = (cx, cy, r) => `<g stroke="#f5a623" stroke-width="2" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => { const t = a * Math.PI / 180; return `<line x1="${cx + Math.cos(t) * (r + 2.5)}" y1="${cy + Math.sin(t) * (r + 2.5)}" x2="${cx + Math.cos(t) * (r + 5)}" y2="${cy + Math.sin(t) * (r + 5)}"/>`; }).join('')}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffc93c"/>`;
  const cloud = (dx, dy, col) => `<path transform="translate(${dx} ${dy})" d="M8 24 a5 5 0 0 1 0 -10 a7 7 0 0 1 13 -2 a5.5 5.5 0 0 1 3 12 Z" fill="${col}" stroke="#8a9aa8" stroke-width="1"/>`;
  switch (id) {
    case 'sun': return sun(16, 16, 7);
    case 'partly': return sun(12, 12, 5.5) + cloud(4, 4, '#ffffff');
    case 'cloud': return cloud(1, 1, '#dfe6ec') + cloud(5, 5, '#ffffff');
    case 'rain': return cloud(3, -2, '#dfe6ec') + `<g stroke="#4f8fcf" stroke-width="2" stroke-linecap="round"><line x1="11" y1="25" x2="9" y2="29"/><line x1="17" y1="25" x2="15" y2="29"/><line x1="23" y1="25" x2="21" y2="29"/></g>`;
    case 'rainbow': return ['#ff6b6b', '#ffb84d', '#ffe066', '#7cd67c', '#6aaaf0', '#a98cf0'].map((c, i) => `<path d="M${3 + i * 1.6} 26 a${13 - i * 1.6} ${13 - i * 1.6} 0 0 1 ${26 - i * 3.2} 0" fill="none" stroke="${c}" stroke-width="1.7"/>`).join('');
  }
}

    $('wheel').innerHTML = slices.map((c, i) => {
      const mid = (i + 0.5) * 360 / N;
      return `<path d="${slicePath(i)}" fill="${i % 2 ? TINT[c.tier] : '#ffffff'}" stroke="#e2513b" stroke-width="2"/>
        <g transform="rotate(${mid} ${C} ${C})">
          <use href="#ck-${c.id}" x="${C - 22}" y="${C - R + 14}" width="44" height="32"/>
          <circle cx="${C}" cy="${C - R + 56}" r="4" fill="${TIERS[c.tier].color}"/>
        </g>`;
    }).join('') + `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#b63a28" stroke-width="4"/>`;
    let b = '';
    for (let i = 0; i < 24; i++) { const a = i * 15 * Math.PI / 180; b += `<circle class="bulb ${i % 2 ? 'odd' : ''}" cx="${C + 155.5 * Math.sin(a)}" cy="${C - 155.5 * Math.cos(a)}" r="3.2"/>`; }
    $('bulbs').innerHTML = b;
  }
  let rot = 0;
  function setRot(d) { rot = d; $('wheel').setAttribute('transform', `rotate(${d} ${C} ${C})`); }

  const spinBtn = $('spin'), hint = $('hint');
  let spinning = false;
  async function spin() {
    if (todayCookie) { openReveal(true); return; }
    if (spinning) return;
    spinning = true; spinBtn.disabled = true; $('wheelbox').classList.add('spinning');
    hint.textContent = '두근두근…';
    const result = rollCookie();
    // 같은 등급 칸이 있으면 그 칸에, 없으면 일반 칸 하나에 결과를 담는다
    let L = slices.findIndex(c => c.tier === result.tier);
    if (L < 0 || result.tier === 'common' || result.tier === 'premium') {
      const cand = slices.map((c, i) => [c, i]).filter(([c]) => c.tier === result.tier).map(([, i]) => i);
      L = cand.length ? cand[Math.floor(Math.random() * cand.length)] : 0;
    }
    const target = 360 * 7 + (360 - ((L + 0.5) * 360 / N)) - (rot % 360) + (Math.random() - 0.5) * (360 / N) * 0.6;
    const start = rot, dur = reduce ? 600 : 4800, t0 = performance.now();
    let swapped = false, lastTick = Math.floor(start / (360 / N));
    await new Promise(res => {
      const step = n => {
        const p = Math.min(1, (n - t0) / dur);
        const e = 1 - Math.pow(1 - p, 4);
        setRot(start + target * e);
        if (!swapped && p > 0.15) { slices[L] = result; renderWheel(); setRot(rot); swapped = true; }
        const tick = Math.floor(rot / (360 / N));
        if (tick !== lastTick && !reduce) { lastTick = tick; const ptr = $('pointer'); ptr.style.transform = 'rotate(-14deg)'; setTimeout(() => ptr.style.transform = '', 60); }
        p < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
    $('wheelbox').classList.remove('spinning');
    todayCookie = result;
    fortune = makeFortune(hashStr(device + todayKey + result.id), result);
    stamps[todayKey] = result.id; store.set('fc3-stamps', stamps);
    dex[result.id] = (dex[result.id] || 0) + 1; store.set('fc3-dex', dex);
    if (testMode) history.replaceState(null, '', location.pathname + location.search);
    renderWeek();
    await new Promise(r => setTimeout(r, reduce ? 0 : 450));
    spinning = false;
    hint.textContent = '';
    openReveal(false);
  }

  // ---------- 쿠키 깨기와 결과 ----------
  const reveal = $('reveal'), big = $('bigcookie'), card = $('card'), stage = $('stage');
  function openReveal(skipCrack) {
    reveal.hidden = false;
    if (skipCrack) { stage.hidden = true; showCard(); return; }
    const c = fortune.cookie, T = TIERS[c.tier];
    $('bigL').setAttribute('href', '#ck-' + c.id); $('bigR').setAttribute('href', '#ck-' + c.id);
    const special = ['rare', 'legend', 'myth'].includes(c.tier);
    big.classList.toggle('glow', special);
    $('tierbanner').textContent = c.tier === 'myth' ? '★ 신화 등급 ★' : c.tier === 'legend' ? '전설 등급!' : c.tier === 'rare' ? '희귀 등급!' : T.name + ' 쿠키';
    $('tierbanner').style.background = T.color;
    $('cookiename').textContent = c.name;
    stage.hidden = false; big.classList.remove('open'); card.hidden = true;
    if (special) confetti(c.tier === 'myth' ? 90 : c.tier === 'legend' ? 60 : 30);
    big.focus({ preventScroll: true });
  }
  big.addEventListener('click', async () => {
    if (big.classList.contains('open')) return;
    big.classList.add('open');
    await new Promise(r => setTimeout(r, reduce ? 0 : 550));
    stage.hidden = true;
    showCard();
  });
  function confetti(n) {
    if (reduce) return;
    const colors = ['#f2c230', '#e2513b', '#fff3a8', '#8fe08a', '#7cc8ff', '#c79bff'];
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'confetti';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      reveal.appendChild(p);
      setTimeout(() => p.remove(), 4200);
    }
  }
  function showCard() {
    const f = fortune, c = f.cookie;
    card.className = 'card';
    card.style.boxShadow = ['rare', 'legend', 'myth'].includes(c.tier) ? `0 0 0 4px ${TIERS[c.tier].color}, 0 20px 50px rgba(0,0,0,.35)` : '';
    card.innerHTML = `
      <div class="when">${todayLabel} · 오늘의 포춘쿠키</div>
      <div class="ckhead">${icon(c.id)}<div><b>${tierChip(c.tier)}${esc(c.name)}</b><small>${esc(c.desc)}</small></div></div>
      <p class="main">${esc(f.msg)}</p>
      ${f.bonus ? `<div class="sec bonus"><h3>${TIERS[c.tier].name} 쿠키의 특별한 한마디</h3><p>${esc(f.bonus)}</p></div>` : ''}
      <div class="sec"><h3>오늘의 업무 일기예보</h3>
        ${f.forecast.map((x, i) => `<div class="wx"><svg viewBox="0 0 32 32" aria-hidden="true">${weatherIcon(x.w.id)}</svg><div><span class="slotname">${x.slot}</span><b>${x.w.name}</b>${i === 2 ? `<span class="leave">칼퇴 확률 ${f.leave}%</span>` : ''}<small>${esc(x.note)}</small></div></div>`).join('')}
      </div>
      <div class="sec"><h3>오늘 조심할 것</h3><p>${esc(f.caution)}</p></div>
      <div class="sec"><h3>오늘의 작은 미션</h3><p>${esc(f.mission)}</p></div>
      <div class="sec"><h3>오늘의 사무실 미신</h3><p>${esc(f.omen)}</p><small class="aside">믿거나 말거나, 해 봐서 손해 볼 건 없어요</small></div>
      <div class="sec quote"><h3>오늘의 한 줄</h3><p>${esc(f.quote[0])}</p><cite>${esc(f.quote[1])}</cite></div>
      <div class="cardbtns"><button class="ghostb" id="copyBtn">문구 복사</button><button class="solid" id="closeBtn">닫기</button></div>
      <div class="copied" id="copied" aria-live="polite"></div>`;
    card.hidden = false;
    $('closeBtn').addEventListener('click', closeReveal);
    $('copyBtn').addEventListener('click', copy);
    $('closeBtn').focus({ preventScroll: true });
    card.scrollTop = 0;
  }

  const pct = p => (p * 100 >= 1 ? (p * 100).toFixed(0) : (p * 100).toFixed(p * 100 >= 0.1 ? 1 : 2)) + '%';
  function showOdds() {
    reveal.hidden = false; stage.hidden = true;
    card.className = 'card panel'; card.style.boxShadow = '';
    card.innerHTML = `<h2>쿠키 확률</h2><p class="lead">룰렛 한 번에 이 확률로 등급이 정해지고, 그 등급 안의 쿠키 중 하나가 나와요</p>
      <table class="odds">${TIER_ORDER.map(t => `<tr><td>${tierChip(t)}</td><td>${BY_TIER[t].length}종</td><td>${pct(TIERS[t].p)}</td></tr>`).join('')}</table>
      <p class="lead">신화 등급은 만 번 돌려야 한 번 나올까 말까 한 확률이에요. 하루에 한 번이니 약 27년에 한 번꼴이에요.</p>
      <div class="cardbtns"><button class="solid" id="closeBtn">닫기</button></div>`;
    card.hidden = false;
    $('closeBtn').addEventListener('click', closeReveal);
    $('closeBtn').focus({ preventScroll: true });
  }
  function showDex() {
    const found = COOKIES.filter(c => dex[c.id]).length;
    const total = Object.values(dex).reduce((a, b) => a + b, 0);
    reveal.hidden = false; stage.hidden = true;
    card.className = 'card panel'; card.style.boxShadow = '';
    card.innerHTML = `<h2>쿠키 도감</h2><p class="lead">${found} / ${COOKIES.length}종 발견 · 지금까지 ${total}번 돌림</p>` +
      TIER_ORDER.slice().reverse().map(t => {
        const list = BY_TIER[t], got = list.filter(c => dex[c.id]).length;
        return `<div class="dexsec"><span>${tierChip(t)}${TIERS[t].name} 쿠키</span><span>${got} / ${list.length}</span></div>
          <div class="dexgrid">${list.map(c => `<div class="dexcell ${dex[c.id] ? '' : 'locked'}">${icon(c.id)}<small>${dex[c.id] ? esc(c.name.replace(' 쿠키', '')) : '???'}</small></div>`).join('')}</div>`;
      }).join('') + `<div class="cardbtns"><button class="solid" id="closeBtn">닫기</button></div>`;
    card.hidden = false;
    card.scrollTop = 0;
    $('closeBtn').addEventListener('click', closeReveal);
    $('closeBtn').focus({ preventScroll: true });
  }
  $('dexBtn').addEventListener('click', showDex);
  $('oddsBtn').addEventListener('click', showOdds);

  function closeReveal() { reveal.hidden = true; setDoneState(); }
  async function copy() {
    const f = fortune, c = f.cookie;
    const text = `🥠 ${todayLabel} 오늘의 포춘쿠키\n[${TIERS[c.tier].name}] ${c.name}\n${f.msg}\n\n` +
      '업무 일기예보: ' + f.forecast.map(x => `${x.slot} ${x.w.name}`).join(' · ') + ` (칼퇴 확률 ${f.leave}%)` +
      `\n조심할 것: ${f.caution}\n오늘의 사무실 미신: ${f.omen}\n"${f.quote[0]}" (${f.quote[1]})`;
    try { await navigator.clipboard.writeText(text); $('copied').textContent = '복사했어요. 동료에게 자랑해 보세요.'; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      $('copied').textContent = ok ? '복사했어요. 동료에게 자랑해 보세요.' : '복사가 막혀 있어요. 문구를 길게 눌러 복사해 주세요.';
    }
  }
  reveal.addEventListener('click', e => { if (e.target === reveal && !card.hidden) closeReveal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !reveal.hidden && !card.hidden) closeReveal(); });

  function setDoneState() {
    if (!todayCookie) return;
    spinBtn.disabled = false;
    spinBtn.classList.add('done');
    spinBtn.innerHTML = '오늘의<br>쿠키 보기';
    hint.textContent = '내일 아침, 룰렛이 다시 열려요';
  }
  spinBtn.addEventListener('click', spin);

  function boot() {
    sampleSlices();
    if (todayCookie) { const L = slices.findIndex(c => c.tier === todayCookie.tier); slices[L < 0 ? 0 : L] = todayCookie; }
    renderWheel(); setRot(0);
    renderWeek();
    setDoneState();
  }
  window.claude?.hot?.snapshot?.(() => ({}));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
})();
</script>
</body>
</html>
